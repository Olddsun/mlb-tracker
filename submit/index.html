<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>提交戰績 · E-Sport League</title>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161a22;
    --border: #252c3a;
    --accent: #4f8ef7;
    --text: #dde3ef;
    --muted: #6b7896;
    --green: #3dba7a;
    --red: #e05c5c;
    --yellow: #e8c44b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .back-btn {
    color: var(--accent); text-decoration: none;
    font-size: 15px; display: flex; align-items: center; gap: 4px;
  }
  header h1 { font-size: 17px; font-weight: 600; }

  .container { padding: 24px 20px 48px; max-width: 480px; margin: 0 auto; }

  /* Steps */
  .step { display: none; }
  .step.active { display: block; }

  .step-badge {
    display: inline-block; font-size: 12px; font-weight: 700;
    color: var(--accent); background: rgba(79,142,247,0.12);
    border-radius: 999px; padding: 4px 12px; margin-bottom: 10px;
    letter-spacing: 0.5px;
  }
  .step-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .step-desc { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

  /* Form */
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .field { margin-bottom: 20px; }

  select, input[type=text], textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 16px;
    padding: 13px 14px; outline: none; font-family: inherit;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: none; height: 80px; line-height: 1.5; }
  ::placeholder { color: var(--muted); }

  /* 指定玩家（核對畫面） */
  .assign-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; margin: 14px 0 18px; text-align: left;
  }
  .assign-row { margin-bottom: 16px; }
  .assign-row:last-child { margin-bottom: 0; }
  .assign-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  .assign-label b { color: var(--text); }
  .assign-box select, .assign-box input[type=text] { background: var(--bg); }
  .new-player-input { margin-top: 8px; }

  /* 必填提示：沒選滿之前整張卡用黃框標出來 */
  .assign-box { transition: border-color .2s, box-shadow .2s; }
  .assign-box.incomplete {
    border-color: rgba(232, 196, 75, 0.55);
    box-shadow: 0 0 0 3px rgba(232, 196, 75, 0.1);
  }
  .assign-box.incomplete select { border-color: rgba(232, 196, 75, 0.45); }
  .assign-hd {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 700; margin-bottom: 14px;
  }
  .assign-hd .req {
    font-size: 11px; font-weight: 700; letter-spacing: .5px;
    color: #0d0f14; background: var(--yellow);
    border-radius: 999px; padding: 2px 9px;
  }
  .assign-note { margin-top: 13px; font-size: 12.5px; color: var(--yellow); line-height: 1.5; }
  .assign-box:not(.incomplete) .assign-note { display: none; }
  @keyframes assign-shake {
    10%, 90% { transform: translateX(-2px); }
    30%, 70% { transform: translateX(4px); }
    50% { transform: translateX(-4px); }
  }
  .assign-box.shake { animation: assign-shake .45s ease; }
  @media (prefers-reduced-motion: reduce) {
    .assign-box.shake { animation: none; }
  }

  /* 核對數據畫面 */
  .rv-hint { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .rv-tm { font-size: 12px; color: var(--muted); }
  .rv-pog { text-align: center; font-size: 13px; color: var(--yellow); margin-bottom: 16px; }
  .rv-tables { margin-bottom: 18px; }
  .rv-team { margin-bottom: 14px; }
  .rv-team-hd { font-size: 14px; font-weight: 700; margin: 12px 0 6px; }
  .rv-team-hd span { color: var(--muted); font-weight: 500; font-size: 13px; }
  .rv-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 8px; }
  .rv-tbl { width: max-content; min-width: 100%; border-collapse: collapse; font-size: 13px; }
  .rv-tbl td.l, .rv-tbl th.l { white-space: nowrap; padding-right: 16px; }
  .rv-tbl th { color: var(--muted); font-weight: 600; font-size: 11px; padding: 4px 6px; text-align: center; border-bottom: 1px solid var(--border); }
  .rv-tbl th.l, .rv-tbl td.l { text-align: left; }
  .rv-tbl td { padding: 5px 6px; text-align: center; color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.05); }

  /* NBA 2K 球隊數據對照表 */
  .nba-tbl { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 18px; }
  .nba-tbl th { color: var(--text); font-weight: 700; font-size: 13px; padding: 6px 4px 8px; border-bottom: 1px solid var(--border); }
  .nba-tbl th.a, .nba-tbl td.a { text-align: left; }
  .nba-tbl th.h, .nba-tbl td.h { text-align: right; }
  .nba-tbl td { padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--text); }
  .nba-tbl td.lab { color: var(--muted); text-align: center; font-size: 12px; white-space: nowrap; padding: 6px 10px; }
  .nba-tbl td.better { font-weight: 700; }
  .nba-tbl td.worse { color: var(--muted); }

  /* Images */
  .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; margin-bottom: 8px; }
  .img-slot {
    aspect-ratio: 9/16; background: var(--surface); border: 2px dashed var(--border);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative; overflow: hidden; transition: border-color 0.15s;
    touch-action: manipulation;
  }
  .img-slot:active { border-color: var(--accent); }
  .img-slot.filled { border-style: solid; border-color: var(--accent); }
  .img-slot.add { border-style: dashed; }
  .img-slot img { width: 100%; height: 100%; object-fit: cover; }
  .img-slot .plus {
    font-size: 26px; color: var(--muted); pointer-events: none; line-height: 1;
  }
  .img-slot .idx {
    position: absolute; bottom: 3px; left: 4px; font-size: 11px; font-weight: 600;
    color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); pointer-events: none; z-index: 1;
  }
  .img-slot .rm {
    position: absolute; top: 4px; right: 4px;
    width: 28px; height: 28px; background: rgba(0,0,0,0.72);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #fff; z-index: 2; touch-action: manipulation;
  }
  .img-slot .rm:active { background: var(--red); }
  .img-hint { font-size: 12px; color: var(--muted); text-align: center; }
  .img-count { font-size: 13px; color: var(--accent); text-align: center; font-weight: 600; margin-bottom: 8px; }
  input[type=file] { display: none; }

  /* Button */
  .btn {
    width: 100%; padding: 16px; border-radius: 12px; border: none;
    font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    margin-top: 24px;
  }
  .btn:active { opacity: 0.8; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  .btn-ghost { background: var(--surface); color: var(--text); }

  /* Processing */
  #step-processing { text-align: center; padding: 48px 0; }
  .spinner {
    width: 48px; height: 48px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .processing-msg { font-size: 15px; color: var(--muted); }

  /* Result */
  #step-result { text-align: center; padding-top: 24px; }
  .result-icon { font-size: 48px; margin-bottom: 16px; }
  .result-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .result-score {
    background: var(--surface); border-radius: 14px; padding: 20px;
    margin: 20px 0; display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 12px;
  }
  .score-team, .rv-tm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .score-player { font-size: 13px; color: var(--muted); }
  .score-num { font-size: 36px; font-weight: 800; }
  .score-num.winner { color: var(--accent); }
  .score-vs { font-size: 13px; color: var(--muted); font-weight: 600; }
  .result-winner { font-size: 15px; color: var(--green); font-weight: 600; margin-bottom: 16px; }
  .warnings { text-align: left; }
  .warning-item {
    background: rgba(232,196,75,0.1); border: 1px solid rgba(232,196,75,0.3);
    border-radius: 8px; padding: 10px 12px; font-size: 13px;
    color: var(--yellow); margin-bottom: 8px;
  }
  .error-box {
    background: rgba(224,92,92,0.1); border: 1px solid rgba(224,92,92,0.3);
    border-radius: 12px; padding: 16px; color: var(--red);
    font-size: 14px; margin: 16px 0; text-align: left;
  }
</style>
</head>
<body>
<header>
  <a href="/" class="back-btn">
    <svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M7 1L1 7l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    返回
  </a>
  <h1>提交戰績紀錄</h1>
</header>

<div class="container">

  <!-- Step 1: 上傳截圖（含身分驗證） -->
  <div class="step active" id="step-upload">
    <span class="step-badge">步驟 1／2</span>
    <div class="step-title">上傳戰績截圖</div>
    <div class="step-desc">張數不限，順序不用排，AI 會自動判斷隊伍和比分</div>

    <button class="btn btn-ghost" onclick="triggerMultiSelect()" style="margin-top:0;margin-bottom:14px;">
      選擇截圖（可一次多選）
    </button>

    <div class="img-count" id="img-count"></div>
    <div class="img-grid" id="img-grid"></div>
    <p class="img-hint" id="img-hint" style="display:none">點縮圖可替換該張，點 ✕ 移除，點最後的「＋」繼續追加</p>

    <input type="file" id="file-input-multi" accept="image/*" multiple>
    <input type="file" id="file-input-single" accept="image/*">

    <button class="btn btn-primary" id="submit-btn" onclick="submitGame()" disabled>
      送出分析
    </button>
  </div>

  <!-- Processing -->
  <div class="step" id="step-processing">
    <div class="spinner"></div>
    <div class="processing-msg" id="processing-msg">AI 解析中，請稍候…</div>
  </div>

  <!-- Step 2: 核對數據＋指定玩家（動態渲染）；也共用於成功／失敗畫面 -->
  <div class="step" id="step-result"></div>

</div>

<script>
let currentSlot = -1
let images = []  // 動態張數，每個元素是壓縮後的 blob
let currentSubmissionId = null

let ROSTER = ['Scott', 'Alvin', 'Vincent']   // 玩家清單，開頁時從 API 更新（失敗就用預設）
fetch('/api/players').then(r => r.json()).then(d => {
  if (Array.isArray(d.players) && d.players.length) ROSTER = d.players.map(p => p.name)
}).catch(() => {})

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

// ── NBA 2K 球隊數據列定義（核對表用；lower = 越低越好、neutral = 不比較） ──
const NBA_ROWS = [
  { k: 'fg', lab: '投籃命中', fmt: s => nbaShoot(s.fgm, s.fga) },
  { k: 'tp', lab: '三分球', fmt: s => nbaShoot(s.tpm, s.tpa) },
  { k: 'ft', lab: '罰球', fmt: s => nbaShoot(s.ftm, s.fta) },
  { k: 'fastbreak', lab: '快攻得分' },
  { k: 'paint', lab: '禁區內得分' },
  { k: 'second_chance', lab: '二次進攻得分' },
  { k: 'bench', lab: '板凳球員得分' },
  { k: 'ast', lab: '助攻' },
  { k: 'oreb', lab: '進攻籃板' },
  { k: 'dreb', lab: '防守籃板' },
  { k: 'stl', lab: '抄截' },
  { k: 'blk', lab: '阻攻' },
  { k: 'to', lab: '失誤（對手得分）', fmt: s => `${s.to ?? 0}（${s.to_points ?? 0}）`, lower: true },
  { k: 'fouls', lab: '球隊犯規', lower: true },
  { k: 'dunks', lab: '灌籃' },
  { k: 'biggest_lead', lab: '最大領先' },
  { k: 'possession', lab: '持球時間', neutral: true },
  { k: 'timeouts', lab: '剩餘暫停數', neutral: true },
]
const nbaShoot = (m, a) => (m == null && a == null) ? '—' : `${m ?? 0}/${a ?? 0}（${a ? Math.round((m ?? 0) / a * 100) : 0}%）`

function nbaRowsHtml(away, home) {
  const num = (s, r) => r.k === 'fg' ? (s.fgm ?? null) : r.k === 'tp' ? (s.tpm ?? null) : r.k === 'ft' ? (s.ftm ?? null) : (typeof s[r.k] === 'number' ? s[r.k] : null)
  return NBA_ROWS.map(r => {
    const av = r.fmt ? r.fmt(away) : (away[r.k] ?? '—')
    const hv = r.fmt ? r.fmt(home) : (home[r.k] ?? '—')
    let aCls = '', hCls = ''
    if (!r.neutral) {
      const an = num(away, r), hn = num(home, r)
      if (an != null && hn != null && an !== hn) {
        const aBetter = r.lower ? an < hn : an > hn
        aCls = aBetter ? ' better' : ' worse'; hCls = aBetter ? ' worse' : ' better'
      }
    }
    return `<tr><td class="a${aCls}">${esc(av)}</td><td class="lab">${r.lab}</td><td class="h${hCls}">${esc(hv)}</td></tr>`
  }).join('')
}

function showStep(id) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'))
  document.getElementById(id).classList.add('active')
  window.scrollTo(0, 0)
}

// 多選（一次可選任意張數，追加到現有清單）
function triggerMultiSelect() {
  currentSlot = -1
  const input = document.getElementById('file-input-multi')
  input.value = ''
  input.click()
}

// 單選（點縮圖替換該張；index = -1 代表點結尾的「＋」追加一張）
function triggerSingleSelect(index) {
  currentSlot = index
  const input = document.getElementById('file-input-single')
  input.value = ''
  input.click()
}

document.getElementById('file-input-multi').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files)
  for (const file of files) {
    images.push(await compressImage(file))
  }
  renderGrid()
})

document.getElementById('file-input-single').addEventListener('change', async (e) => {
  const file = e.target.files[0]
  if (!file) return
  const compressed = await compressImage(file)
  if (currentSlot >= 0 && currentSlot < images.length) {
    images[currentSlot] = compressed   // 替換特定張
  } else {
    images.push(compressed)            // 追加
  }
  renderGrid()
})

// 依 images 陣列重畫縮圖 + 結尾「＋」追加槽
function renderGrid() {
  const grid = document.getElementById('img-grid')
  const thumbs = images.map((blob, i) => {
    const url = URL.createObjectURL(blob)
    return `<div class="img-slot filled" onclick="triggerSingleSelect(${i})">
      <img src="${url}" alt="截圖 ${i + 1}">
      <span class="idx">${i + 1}</span>
      <div class="rm" onclick="removeImage(event, ${i})" role="button" aria-label="移除截圖 ${i + 1}">✕</div>
    </div>`
  }).join('')
  // 「＋」開相簿多選（可一次再加好幾張）；要換掉某一張才是點該張縮圖走單選
  const addSlot = `<div class="img-slot add" onclick="triggerMultiSelect()" role="button" aria-label="從相簿再選截圖，可一次多選"><span class="plus">＋</span></div>`
  grid.innerHTML = thumbs + addSlot
  document.getElementById('img-count').textContent = images.length ? `已選 ${images.length} 張` : ''
  document.getElementById('img-hint').style.display = images.length ? 'block' : 'none'
  updateSubmitBtn()
}
renderGrid()   // 開頁就畫出「＋」追加格，不然使用者只看得到上方按鈕

function removeImage(e, index) {
  e.stopPropagation()
  images.splice(index, 1)
  renderGrid()
}

function updateSubmitBtn() {
  document.getElementById('submit-btn').disabled = images.length < 1
}

async function compressImage(file) {
  return new Promise(resolve => {
    const img = new Image()
    const url = URL.createObjectURL(file)
    img.onload = () => {
      const maxW = 1600
      let w = img.width, h = img.height
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW }
      const canvas = document.createElement('canvas')
      canvas.width = w; canvas.height = h
      canvas.getContext('2d').drawImage(img, 0, 0, w, h)
      canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.82)
      URL.revokeObjectURL(url)
    }
    img.src = url
  })
}

async function submitGame() {
  if (!images.length) return alert('請至少上傳 1 張截圖')

  showStep('step-processing')
  setMsg('AI 解析中，約需 30 秒 ⏳　請留在此畫面、不要離開或關閉，否則會讀取失敗')

  try {
    const formData = new FormData()
    images.forEach((img, i) => formData.append(`image_${i}`, img, `${i}.jpg`))

    // 後端同步解析完回應（約 30 秒），回來是解析結果讓你先核對＋指定玩家，不會直接記錄
    const res = await fetch('/api/submit-game', { method: 'POST', body: formData })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || '上傳失敗')
    if (data.status === 'failed') return showError(data.error || 'AI 解析失敗，請重新上傳')
    showReview(data)
  } catch (err) {
    showError(err.message)
  }
}

// 核對畫面：AI 讀到的隊伍/比分/數據攤開核對，並指定兩隊各是哪位玩家，確認才記錄
function showReview(data) {
  currentSubmissionId = data.submissionId
  const g = data.game
  const warns = []
  // AI 自己標出的疑慮（例如逐局加總對不上總分、某局被面板擋住）逐條列出來，比一句籠統提醒有用
  const notes = Array.isArray(data.uncertainties) ? data.uncertainties.filter(Boolean) : []
  if (notes.length) warns.push(...notes)
  else if (data.needsReview) warns.push('AI 對部分數據不太確定，請仔細核對')
  if ((data.duplicates?.length ?? 0) > 0) warns.push('這場好像記過了（今天已有同兩隊的比賽紀錄）')

  const awayWon = g.awayScore > g.homeScore
  const playerSelect = (side) => `
    <select id="sel-${side}" onchange="onAssignChange('${side}')">
      <option value="">選擇玩家…</option>
      ${ROSTER.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('')}
      <option value="__new__">＋ 新增玩家…</option>
    </select>
    <input type="text" id="new-${side}" class="new-player-input" placeholder="輸入新玩家名字" maxlength="20"
      autocomplete="off" autocorrect="off" style="display:none" oninput="refreshConfirm()">`

  const teamBlock = (label, teamName, batting, pitching) => `
    <div class="rv-team">
      <div class="rv-team-hd">${esc(label)}　<span>${esc(teamName)}</span></div>
      <div class="rv-scroll"><table class="rv-tbl"><thead><tr><th class="l">打者</th><th>AB</th><th>H</th><th>HR</th><th>RBI</th></tr></thead><tbody>
        ${(batting || []).map(b => `<tr><td class="l">${esc(b.name)}</td><td>${b.ab ?? 0}</td><td>${b.h ?? 0}</td><td>${b.hr ?? 0}</td><td>${b.rbi ?? 0}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="rv-scroll"><table class="rv-tbl"><thead><tr><th class="l">投手</th><th>IP</th><th>H</th><th>ER</th><th>SO</th></tr></thead><tbody>
        ${(pitching || []).map(p => `<tr><td class="l">${esc(p.name)}${p.decision ? ` (${esc(p.decision)})` : ''}</td><td>${esc(p.ip ?? '')}</td><td>${p.h ?? 0}</td><td>${p.er ?? 0}</td><td>${p.so ?? 0}</td></tr>`).join('')}
      </tbody></table></div>
    </div>`

  showStep('step-result')
  document.getElementById('step-result').innerHTML = `
    <span class="step-badge">步驟 2／2</span>
    <div class="result-title" style="margin-bottom:4px">核對數據</div>
    <p class="rv-hint">AI 判讀為 <b>${g.sport === 'nba2k' ? '🏀 NBA 2K' : '⚾ MLB The Show'}</b>，選一下兩隊各是誰，並對照截圖檢查數據</p>
    ${warns.length ? `<div class="warnings">${warns.map(w => `<div class="warning-item">⚠️ ${esc(w)}</div>`).join('')}</div>` : ''}
    <div class="result-score" style="margin:16px 0 4px">
      <div><div class="score-player">客隊</div><div class="rv-tm">${esc(g.awayTeam)}</div><div class="score-num ${awayWon ? 'winner' : ''}">${g.awayScore}</div></div>
      <div class="score-vs">VS</div>
      <div><div class="score-player">主隊</div><div class="rv-tm">${esc(g.homeTeam)}</div><div class="score-num ${awayWon ? '' : 'winner'}">${g.homeScore}</div></div>
    </div>
    <div class="assign-box incomplete" id="assign-box">
      <div class="assign-hd">指定玩家<span class="req">必填</span></div>
      <div class="assign-row">
        <div class="assign-label">客隊 <b>${esc(g.awayTeam)}</b>（${g.awayScore} 分）是誰打的？</div>
        ${playerSelect('away')}
      </div>
      <div class="assign-row">
        <div class="assign-label">主隊 <b>${esc(g.homeTeam)}</b>（${g.homeScore} 分）是誰打的？</div>
        ${playerSelect('home')}
      </div>
      <div class="assign-note" id="assign-note">⚠️ 兩隊都選好玩家，才能記錄這場比賽</div>
    </div>
    ${g.playerOfGame ? `<div class="rv-pog">★ 單場最佳：${esc(g.playerOfGame.name)}（${esc(g.playerOfGame.team)}）</div>` : ''}
    ${g.sport === 'nba2k' ? `
    <div class="rv-scroll"><table class="nba-tbl">
      <thead><tr><th class="a">${esc(g.awayTeam)}</th><th class="lab"></th><th class="h">${esc(g.homeTeam)}</th></tr></thead>
      <tbody>
        <tr><td class="a${awayWon ? ' better' : ' worse'}">${g.awayScore}</td><td class="lab">得分</td><td class="h${awayWon ? ' worse' : ' better'}">${g.homeScore}</td></tr>
        ${nbaRowsHtml(g.teamStats?.away || {}, g.teamStats?.home || {})}
      </tbody>
    </table></div>` : `
    <div class="rv-tables">
      ${teamBlock('客隊', g.awayTeam, g.awayBatting, g.awayPitching)}
      ${teamBlock('主隊', g.homeTeam, g.homeBatting, g.homePitching)}
    </div>`}
    <button class="btn btn-primary" id="rv-confirm" onclick="commitGame()" disabled>先選好兩隊是誰</button>
    <button class="btn btn-ghost" onclick="showStep('step-upload')">數據有誤，重新上傳</button>
  `
}

// 下拉選到「＋ 新增玩家…」就顯示名字輸入框
function onAssignChange(side) {
  const isNew = document.getElementById('sel-' + side).value === '__new__'
  const inp = document.getElementById('new-' + side)
  inp.style.display = isNew ? 'block' : 'none'
  if (isNew) inp.focus()
  refreshConfirm()
}

// 該隊目前指定的玩家名（下拉值，或新增玩家輸入的名字）
function assignValue(side) {
  const v = document.getElementById('sel-' + side).value
  return v === '__new__' ? document.getElementById('new-' + side).value.trim() : v
}

// 兩隊都指定、且不是同一人，才算填完
function assignReady() {
  const h = assignValue('home'), a = assignValue('away')
  return { h, a, ok: !!(h && a && h.toLowerCase() !== a.toLowerCase()) }
}

function refreshConfirm() {
  const { h, a, ok } = assignReady()
  const btn = document.getElementById('rv-confirm')
  if (btn) {
    btn.disabled = !ok
    btn.textContent = ok ? '確認無誤，記錄這場' : (h && a ? '兩隊不能是同一位玩家' : '先選好兩隊是誰')
  }
  const box = document.getElementById('assign-box')
  if (box) box.classList.toggle('incomplete', !ok)
  const note = document.getElementById('assign-note')
  if (note) note.textContent = (h && a && h.toLowerCase() === a.toLowerCase())
    ? '⚠️ 兩隊不能是同一位玩家'
    : '⚠️ 兩隊都選好玩家，才能記錄這場比賽'
}

// 沒填完就按了 → 捲到指定玩家那張卡、抖一下提醒
function flagAssignMissing() {
  const box = document.getElementById('assign-box')
  if (!box) return
  box.classList.add('incomplete', 'shake')
  box.scrollIntoView({ behavior: 'smooth', block: 'center' })
  setTimeout(() => box.classList.remove('shake'), 500)
}

// 使用者按確認 → 帶上玩家指定，才真正寫入正式資料
async function commitGame() {
  if (!assignReady().ok) return flagAssignMissing()   // 按鈕理應是 disabled，這裡再擋一次
  const btn = document.getElementById('rv-confirm')
  if (btn) { btn.disabled = true; btn.textContent = '記錄中…' }
  try {
    const res = await fetch('/api/submit-game', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        submissionId: currentSubmissionId,
        homePlayer: assignValue('home'),
        awayPlayer: assignValue('away'),
      }),
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || '記錄失敗')
    showResult({ success: true, game: data.game, warnings: data.warnings })
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = '確認無誤，記錄這場' }
    alert('記錄失敗：' + err.message)   // 留在核對畫面，可再按一次
  }
}

function setMsg(msg) {
  document.getElementById('processing-msg').textContent = msg
}

function showResult(result) {
  showStep('step-result')
  const g = result.game
  const homeWon = g.winner === g.homePlayer
  const awayWon = g.winner === g.awayPlayer

  document.getElementById('step-result').innerHTML = `
    <div class="result-icon">🏆</div>
    <div class="result-title">比賽記錄成功！</div>
    <div class="result-winner">${g.winner} 獲勝</div>
    <div class="result-score">
      <div>
        <div class="score-player">${g.homePlayer}</div>
        <div class="score-team" style="font-size:12px;color:var(--muted)">${g.homeTeam}</div>
        <div class="score-num ${homeWon ? 'winner' : ''}">${g.homeScore}</div>
      </div>
      <div class="score-vs">VS</div>
      <div>
        <div class="score-player">${g.awayPlayer}</div>
        <div class="score-team" style="font-size:12px;color:var(--muted)">${g.awayTeam}</div>
        <div class="score-num ${awayWon ? 'winner' : ''}">${g.awayScore}</div>
      </div>
    </div>
    ${result.warnings?.length ? `
      <div class="warnings">
        ${result.warnings.map(w => `<div class="warning-item">⚠️ ${w}</div>`).join('')}
      </div>
    ` : ''}
    <button class="btn btn-primary" onclick="location.href='/'">回到主頁</button>
    <button class="btn btn-ghost" onclick="location.reload()">再記一場</button>
  `
}

function showError(msg) {
  showStep('step-result')
  document.getElementById('step-result').innerHTML = `
    <div class="result-icon">❌</div>
    <div class="result-title">提交失敗</div>
    <div class="error-box">${msg}</div>
    <button class="btn btn-primary" onclick="showStep('step-upload')">重新上傳</button>
    <button class="btn btn-ghost" onclick="location.href='/'">返回主頁</button>
  `
}

// PWA 自動更新：切回前台檢查新版、新 SW 接管時自動重載
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(reg => {
    reg.update();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') reg.update();
    });
  });
  navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
}
</script>
</body>
</html>
