<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>提交戰績 · E-Sport League</title>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161a22;
    --border: #252c3a;
    --accent: #4f8ef7;
    --text: #dde3ef;
    --muted: #6b7896;
    --green: #3dba7a;
    --red: #e05c5c;
    --yellow: #e8c44b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .back-btn {
    color: var(--accent); text-decoration: none;
    font-size: 15px; display: flex; align-items: center; gap: 4px;
  }
  header h1 { font-size: 17px; font-weight: 600; }

  .container { padding: 24px 20px 48px; max-width: 480px; margin: 0 auto; }

  /* Steps */
  .step { display: none; }
  .step.active { display: block; }

  .step-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .step-desc { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

  /* Form */
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .field { margin-bottom: 20px; }

  select, input[type=text], textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 16px;
    padding: 13px 14px; outline: none; font-family: inherit;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: none; height: 80px; line-height: 1.5; }
  ::placeholder { color: var(--muted); }

  /* Player select */
  .player-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .player-btn {
    background: var(--surface); border: 2px solid var(--border);
    border-radius: 12px; padding: 16px 8px; text-align: center;
    cursor: pointer; transition: all 0.15s; color: var(--text);
    font-size: 15px; font-weight: 600;
  }
  .player-btn.selected { border-color: var(--accent); background: rgba(79,142,247,0.12); color: var(--accent); }

  /* Team combobox */
  .team-combo { position: relative; }
  .team-combo input.filled { border-color: var(--accent); }
  .combo-list {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20;
    background: #1e2531; border: 1px solid var(--border); border-radius: 10px;
    max-height: 260px; overflow-y: auto; box-shadow: 0 10px 28px rgba(0,0,0,0.55);
    -webkit-overflow-scrolling: touch;
  }
  .combo-list.hidden { display: none; }
  .combo-opt {
    display: flex; align-items: baseline; gap: 8px; min-height: 46px;
    padding: 12px 14px; cursor: pointer; border-bottom: 1px solid var(--border);
    touch-action: manipulation;
  }
  .combo-opt:last-child { border-bottom: none; }
  .combo-opt:active { background: rgba(79,142,247,0.16); }
  .combo-opt .zh { font-size: 15px; color: var(--text); font-weight: 600; }
  .combo-opt .en { font-size: 12px; color: var(--muted); }
  .combo-empty { padding: 13px 14px; color: var(--muted); font-size: 13px; }

  /* 核對數據畫面 */
  .rv-hint { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .rv-tm { font-size: 12px; color: var(--muted); }
  .rv-pog { text-align: center; font-size: 13px; color: var(--yellow); margin-bottom: 16px; }
  .rv-tables { margin-bottom: 18px; }
  .rv-team { margin-bottom: 14px; }
  .rv-team-hd { font-size: 14px; font-weight: 700; margin: 12px 0 6px; }
  .rv-team-hd span { color: var(--muted); font-weight: 500; font-size: 13px; }
  .rv-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 8px; }
  .rv-tbl { width: max-content; min-width: 100%; border-collapse: collapse; font-size: 13px; }
  .rv-tbl td.l, .rv-tbl th.l { white-space: nowrap; padding-right: 16px; }
  .rv-tbl th { color: var(--muted); font-weight: 600; font-size: 11px; padding: 4px 6px; text-align: center; border-bottom: 1px solid var(--border); }
  .rv-tbl th.l, .rv-tbl td.l { text-align: left; }
  .rv-tbl td { padding: 5px 6px; text-align: center; color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.05); }

  /* Images */
  .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; margin-bottom: 8px; }
  .img-slot {
    aspect-ratio: 9/16; background: var(--surface); border: 2px dashed var(--border);
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative; overflow: hidden; transition: border-color 0.15s;
    touch-action: manipulation;
  }
  .img-slot:active { border-color: var(--accent); }
  .img-slot.filled { border-style: solid; border-color: var(--accent); }
  .img-slot.add { border-style: dashed; }
  .img-slot img { width: 100%; height: 100%; object-fit: cover; }
  .img-slot .plus {
    font-size: 26px; color: var(--muted); pointer-events: none; line-height: 1;
  }
  .img-slot .idx {
    position: absolute; bottom: 3px; left: 4px; font-size: 11px; font-weight: 600;
    color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); pointer-events: none; z-index: 1;
  }
  .img-slot .rm {
    position: absolute; top: 4px; right: 4px;
    width: 28px; height: 28px; background: rgba(0,0,0,0.72);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #fff; z-index: 2; touch-action: manipulation;
  }
  .img-slot .rm:active { background: var(--red); }
  .img-hint { font-size: 12px; color: var(--muted); text-align: center; }
  .img-count { font-size: 13px; color: var(--accent); text-align: center; font-weight: 600; margin-bottom: 8px; }
  input[type=file] { display: none; }

  /* Button */
  .btn {
    width: 100%; padding: 16px; border-radius: 12px; border: none;
    font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    margin-top: 24px;
  }
  .btn:active { opacity: 0.8; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  .btn-ghost { background: var(--surface); color: var(--text); }

  /* Processing */
  #step-processing { text-align: center; padding: 48px 0; }
  .spinner {
    width: 48px; height: 48px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .processing-msg { font-size: 15px; color: var(--muted); }

  /* Result */
  #step-result { text-align: center; padding-top: 24px; }
  .result-icon { font-size: 48px; margin-bottom: 16px; }
  .result-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .result-score {
    background: var(--surface); border-radius: 14px; padding: 20px;
    margin: 20px 0; display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 12px;
  }
  .score-team, .rv-tm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .score-player { font-size: 13px; color: var(--muted); }
  .score-num { font-size: 36px; font-weight: 800; }
  .score-num.winner { color: var(--accent); }
  .score-vs { font-size: 13px; color: var(--muted); font-weight: 600; }
  .result-winner { font-size: 15px; color: var(--green); font-weight: 600; margin-bottom: 16px; }
  .warnings { text-align: left; }
  .warning-item {
    background: rgba(232,196,75,0.1); border: 1px solid rgba(232,196,75,0.3);
    border-radius: 8px; padding: 10px 12px; font-size: 13px;
    color: var(--yellow); margin-bottom: 8px;
  }
  .error-box {
    background: rgba(224,92,92,0.1); border: 1px solid rgba(224,92,92,0.3);
    border-radius: 12px; padding: 16px; color: var(--red);
    font-size: 14px; margin: 16px 0; text-align: left;
  }
</style>
</head>
<body>
<header>
  <a href="/" class="back-btn">
    <svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M7 1L1 7l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    返回
  </a>
  <h1>提交戰績紀錄</h1>
</header>

<div class="container">

  <!-- Step 1: 身份 -->
  <div class="step active" id="step-identity">
    <div class="step-title">你是誰？</div>
    <div class="step-desc">選擇提交者並輸入 token</div>

    <div class="field">
      <label>提交者</label>
      <div class="player-grid">
        <button class="player-btn" data-player="Scott" onclick="selectPlayer(this)">Scott</button>
        <button class="player-btn" data-player="Alvin" onclick="selectPlayer(this)">Alvin</button>
        <button class="player-btn" data-player="Vincent" onclick="selectPlayer(this)">Vincent</button>
      </div>
    </div>

    <div class="field">
      <label>Token</label>
      <input type="text" id="token-input" placeholder="輸入你的名字" autocomplete="off" autocorrect="off">
    </div>

    <button class="btn btn-primary" onclick="goToStep2()">下一步</button>
  </div>

  <!-- Step 2: 對戰資訊 -->
  <div class="step" id="step-match">
    <div class="step-title">這場怎麼打？</div>
    <div class="step-desc">選好玩家和隊伍就行</div>

    <div class="field">
      <label>你（<span id="me-name">Scott</span>）用哪隊？</label>
      <div class="team-combo">
        <input type="text" id="team-me" placeholder="打隊名搜尋，例：釀" autocomplete="off" autocorrect="off" inputmode="search">
        <div class="combo-list hidden" id="list-me"></div>
      </div>
    </div>

    <div class="field">
      <label>對手是誰？</label>
      <div class="player-grid" id="opp-grid" style="grid-template-columns:repeat(2,1fr)"></div>
    </div>

    <div class="field">
      <label>對手用哪隊？</label>
      <div class="team-combo">
        <input type="text" id="team-opp" placeholder="打隊名搜尋，例：響" autocomplete="off" autocorrect="off" inputmode="search">
        <div class="combo-list hidden" id="list-opp"></div>
      </div>
    </div>

    <input type="hidden" id="mapping-input">

    <button class="btn btn-primary" onclick="goToStep3()">下一步</button>
    <button class="btn btn-ghost" onclick="showStep('step-identity')">上一步</button>
  </div>

  <!-- Step 3: 上傳截圖 -->
  <div class="step" id="step-upload">
    <div class="step-title">上傳截圖</div>
    <div class="step-desc">張數不限，順序也不用排，AI 會自動判斷</div>

    <button class="btn btn-ghost" onclick="triggerMultiSelect()" style="margin-top:0;margin-bottom:14px;">
      選擇截圖（可一次多選）
    </button>

    <div class="img-count" id="img-count"></div>
    <div class="img-grid" id="img-grid"></div>
    <p class="img-hint">點縮圖可替換該張，點 ✕ 移除，點最後的「＋」繼續追加</p>

    <input type="file" id="file-input-multi" accept="image/*" multiple>
    <input type="file" id="file-input-single" accept="image/*">

    <button class="btn btn-primary" id="submit-btn" onclick="submitGame()" disabled>
      送出分析
    </button>
    <button class="btn btn-ghost" onclick="showStep('step-match')">上一步</button>
  </div>

  <!-- Processing -->
  <div class="step" id="step-processing">
    <div class="spinner"></div>
    <div class="processing-msg" id="processing-msg">AI 解析中，請稍候…</div>
  </div>

  <!-- Result -->
  <div class="step" id="step-result"></div>

</div>

<script>
let selectedPlayer = ''
let currentSlot = -1
let images = []  // 動態張數，每個元素是壓縮後的 blob

// ── Step 2：玩家與隊伍選擇 ──
const ALL_PLAYERS = ['Scott', 'Alvin', 'Vincent']
let oppPlayer = ''
let teamMe = null, teamOpp = null
const MLB_TEAMS = [
  { zh: '洋基', en: 'Yankees' }, { zh: '紅襪', en: 'Red Sox' }, { zh: '藍鳥', en: 'Blue Jays' }, { zh: '光芒', en: 'Rays' }, { zh: '金鶯', en: 'Orioles' },
  { zh: '守護者', en: 'Guardians' }, { zh: '白襪', en: 'White Sox' }, { zh: '老虎', en: 'Tigers' }, { zh: '皇家', en: 'Royals' }, { zh: '雙城', en: 'Twins' },
  { zh: '太空人', en: 'Astros' }, { zh: '遊騎兵', en: 'Rangers' }, { zh: '運動家', en: 'Athletics' }, { zh: '天使', en: 'Angels' }, { zh: '水手', en: 'Mariners' },
  { zh: '大都會', en: 'Mets' }, { zh: '勇士', en: 'Braves' }, { zh: '費城人', en: 'Phillies' }, { zh: '國民', en: 'Nationals' }, { zh: '馬林魚', en: 'Marlins' },
  { zh: '釀酒人', en: 'Brewers' }, { zh: '紅雀', en: 'Cardinals' }, { zh: '小熊', en: 'Cubs' }, { zh: '海盜', en: 'Pirates' }, { zh: '紅人', en: 'Reds' },
  { zh: '道奇', en: 'Dodgers' }, { zh: '教士', en: 'Padres' }, { zh: '巨人', en: 'Giants' }, { zh: '響尾蛇', en: 'Diamondbacks' }, { zh: '落磯', en: 'Rockies' },
]
const teamLabel = (t) => `${t.zh}（${t.en}）`

function renderComboList(list, query) {
  const q = (query || '').trim().toLowerCase()
  const rows = MLB_TEAMS.map((t, i) => ({ t, i })).filter(({ t }) => !q || t.zh.includes(q) || t.en.toLowerCase().includes(q))
  list.innerHTML = rows.length
    ? rows.map(({ t, i }) => `<div class="combo-opt" data-i="${i}"><span class="zh">${t.zh}</span><span class="en">${t.en}</span></div>`).join('')
    : '<div class="combo-empty">找不到這隊</div>'
  list.classList.remove('hidden')
}

function setupCombo(inputId, listId, setter) {
  const input = document.getElementById(inputId)
  const list = document.getElementById(listId)
  input.addEventListener('focus', () => { input.select(); renderComboList(list, '') })
  input.addEventListener('input', () => { setter(null); input.classList.remove('filled'); renderComboList(list, input.value) })
  input.addEventListener('blur', () => setTimeout(() => list.classList.add('hidden'), 200))
  list.addEventListener('click', (e) => {
    const opt = e.target.closest('.combo-opt'); if (!opt) return
    const t = MLB_TEAMS[+opt.dataset.i]
    setter(t); input.value = teamLabel(t); input.classList.add('filled'); list.classList.add('hidden')
  })
}
setupCombo('team-me', 'list-me', (t) => { teamMe = t })
setupCombo('team-opp', 'list-opp', (t) => { teamOpp = t })

function renderOpponents() {
  const grid = document.getElementById('opp-grid')
  const others = ALL_PLAYERS.filter(p => p !== selectedPlayer)
  if (!others.includes(oppPlayer)) oppPlayer = ''
  grid.innerHTML = others.map(p => `<button class="player-btn${p === oppPlayer ? ' selected' : ''}" data-player="${p}" onclick="selectOpp(this)">${p}</button>`).join('')
}
function selectOpp(btn) {
  document.querySelectorAll('#opp-grid .player-btn').forEach(b => b.classList.remove('selected'))
  btn.classList.add('selected'); oppPlayer = btn.dataset.player
}

let currentSubmissionId = null
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

const PENDING_KEY = 'esl_pending_submission'

function savePending(submissionId) {
  localStorage.setItem(PENDING_KEY, JSON.stringify({ submissionId, savedAt: Date.now() }))
}

function clearPending() {
  localStorage.removeItem(PENDING_KEY)
}

// 頁面載入時，若有未完成的提交則自動繼續查詢
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem(PENDING_KEY)
  if (!saved) return
  const { submissionId, savedAt } = JSON.parse(saved)
  if (Date.now() - savedAt > 10 * 60 * 1000) { clearPending(); return }
  showStep('step-processing')
  setMsg('偵測到上次未完成的提交，繼續查詢中…')
  pollResult(submissionId)
})

function selectPlayer(btn) {
  document.querySelectorAll('.player-btn').forEach(b => b.classList.remove('selected'))
  btn.classList.add('selected')
  selectedPlayer = btn.dataset.player
  const tokenInput = document.getElementById('token-input')
  if (!tokenInput.value) tokenInput.value = selectedPlayer
}

function showStep(id) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'))
  document.getElementById(id).classList.add('active')
  window.scrollTo(0, 0)
}

function goToStep2() {
  if (!selectedPlayer) return alert('請選擇提交者')
  const token = document.getElementById('token-input').value.trim()
  if (!token) return alert('請輸入 Token')
  document.getElementById('me-name').textContent = selectedPlayer
  renderOpponents()
  showStep('step-match')
}

function goToStep3() {
  if (!teamMe) return alert(`請選擇 ${selectedPlayer} 用的隊伍`)
  if (!oppPlayer) return alert('請選擇對手')
  if (!teamOpp) return alert(`請選擇 ${oppPlayer} 用的隊伍`)
  document.getElementById('mapping-input').value =
    `${selectedPlayer}：${teamLabel(teamMe)} / ${oppPlayer}：${teamLabel(teamOpp)}`
  renderGrid()
  showStep('step-upload')
}

// 多選（一次可選任意張數，追加到現有清單）
function triggerMultiSelect() {
  currentSlot = -1
  const input = document.getElementById('file-input-multi')
  input.value = ''
  input.click()
}

// 單選（點縮圖替換該張；index = -1 代表點結尾的「＋」追加一張）
function triggerSingleSelect(index) {
  currentSlot = index
  const input = document.getElementById('file-input-single')
  input.value = ''
  input.click()
}

document.getElementById('file-input-multi').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files)
  for (const file of files) {
    images.push(await compressImage(file))
  }
  renderGrid()
})

document.getElementById('file-input-single').addEventListener('change', async (e) => {
  const file = e.target.files[0]
  if (!file) return
  const compressed = await compressImage(file)
  if (currentSlot >= 0 && currentSlot < images.length) {
    images[currentSlot] = compressed   // 替換特定張
  } else {
    images.push(compressed)            // 追加
  }
  renderGrid()
})

// 依 images 陣列重畫縮圖 + 結尾「＋」追加槽
function renderGrid() {
  const grid = document.getElementById('img-grid')
  const thumbs = images.map((blob, i) => {
    const url = URL.createObjectURL(blob)
    return `<div class="img-slot filled" onclick="triggerSingleSelect(${i})">
      <img src="${url}" alt="截圖 ${i + 1}">
      <span class="idx">${i + 1}</span>
      <div class="rm" onclick="removeImage(event, ${i})" role="button" aria-label="移除截圖 ${i + 1}">✕</div>
    </div>`
  }).join('')
  const addSlot = `<div class="img-slot add" onclick="triggerSingleSelect(-1)" role="button" aria-label="追加截圖"><span class="plus">＋</span></div>`
  grid.innerHTML = thumbs + addSlot
  document.getElementById('img-count').textContent = images.length ? `已選 ${images.length} 張` : ''
  updateSubmitBtn()
}

function removeImage(e, index) {
  e.stopPropagation()
  images.splice(index, 1)
  renderGrid()
}

function updateSubmitBtn() {
  document.getElementById('submit-btn').disabled = images.length < 1
}

async function compressImage(file) {
  return new Promise(resolve => {
    const img = new Image()
    const url = URL.createObjectURL(file)
    img.onload = () => {
      const maxW = 1600
      let w = img.width, h = img.height
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW }
      const canvas = document.createElement('canvas')
      canvas.width = w; canvas.height = h
      canvas.getContext('2d').drawImage(img, 0, 0, w, h)
      canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.82)
      URL.revokeObjectURL(url)
    }
    img.src = url
  })
}

async function submitGame() {
  const token = document.getElementById('token-input').value.trim()
  const rawUserInput = document.getElementById('mapping-input').value.trim()

  showStep('step-processing')
  setMsg('AI 解析中，約需 30 秒 ⏳　請留在此畫面、不要離開或關閉，否則會讀取失敗')

  try {
    const formData = new FormData()
    formData.append('submittedBy', selectedPlayer)
    formData.append('token', token)
    formData.append('rawUserInput', rawUserInput)
    images.forEach((img, i) => formData.append(`image_${i}`, img, `${i}.jpg`))

    // 後端同步解析完回應（約 30 秒），回來是解析結果讓你先核對，不會直接記錄
    const res = await fetch('/api/submit-game', { method: 'POST', body: formData })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || '上傳失敗')
    if (data.status === 'failed') return showError(data.error || 'AI 解析失敗，請重新上傳')
    showReview(data)
  } catch (err) {
    showError(err.message)
  }
}

// 審核畫面：把 AI 讀到的數據攤開讓使用者核對，確認才記錄
function showReview(data) {
  currentSubmissionId = data.submissionId
  const g = data.game
  const warns = []
  if (data.needsReview) warns.push('AI 對部分數據不太確定，請仔細核對')
  if ((data.duplicates?.length ?? 0) > 0) warns.push('這場好像記過了（同一天、同兩位玩家已有紀錄）')

  const teamBlock = (label, teamName, batting, pitching) => `
    <div class="rv-team">
      <div class="rv-team-hd">${esc(label)}　<span>${esc(teamName)}</span></div>
      <div class="rv-scroll"><table class="rv-tbl"><thead><tr><th class="l">打者</th><th>AB</th><th>H</th><th>HR</th><th>RBI</th></tr></thead><tbody>
        ${(batting || []).map(b => `<tr><td class="l">${esc(b.name)}</td><td>${b.ab ?? 0}</td><td>${b.h ?? 0}</td><td>${b.hr ?? 0}</td><td>${b.rbi ?? 0}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="rv-scroll"><table class="rv-tbl"><thead><tr><th class="l">投手</th><th>IP</th><th>H</th><th>ER</th><th>SO</th></tr></thead><tbody>
        ${(pitching || []).map(p => `<tr><td class="l">${esc(p.name)}${p.decision ? ` (${esc(p.decision)})` : ''}</td><td>${esc(p.ip ?? '')}</td><td>${p.h ?? 0}</td><td>${p.er ?? 0}</td><td>${p.so ?? 0}</td></tr>`).join('')}
      </tbody></table></div>
    </div>`

  showStep('step-result')
  document.getElementById('step-result').innerHTML = `
    <div class="result-title" style="margin-bottom:4px">核對數據</div>
    <p class="rv-hint">對照你的截圖檢查有沒有讀錯，正確再記錄</p>
    ${warns.length ? `<div class="warnings">${warns.map(w => `<div class="warning-item">⚠️ ${esc(w)}</div>`).join('')}</div>` : ''}
    <div class="result-score" style="margin:16px 0 4px">
      <div><div class="score-player">${esc(g.awayPlayer)}</div><div class="rv-tm">${esc(g.awayTeam)}</div><div class="score-num ${g.winner === g.awayPlayer ? 'winner' : ''}">${g.awayScore}</div></div>
      <div class="score-vs">VS</div>
      <div><div class="score-player">${esc(g.homePlayer)}</div><div class="rv-tm">${esc(g.homeTeam)}</div><div class="score-num ${g.winner === g.homePlayer ? 'winner' : ''}">${g.homeScore}</div></div>
    </div>
    ${g.playerOfGame ? `<div class="rv-pog">★ 單場最佳：${esc(g.playerOfGame.name)}（${esc(g.playerOfGame.team)}）</div>` : ''}
    <div class="rv-tables">
      ${teamBlock(g.awayPlayer, g.awayTeam, g.awayBatting, g.awayPitching)}
      ${teamBlock(g.homePlayer, g.homeTeam, g.homeBatting, g.homePitching)}
    </div>
    <button class="btn btn-primary" id="rv-confirm" onclick="commitGame()">確認無誤，記錄這場</button>
    <button class="btn btn-ghost" onclick="showStep('step-upload')">數據有誤，重新上傳</button>
  `
}

// 使用者按確認 → 才真正寫入正式資料
async function commitGame() {
  const btn = document.getElementById('rv-confirm')
  if (btn) { btn.disabled = true; btn.textContent = '記錄中…' }
  try {
    const res = await fetch('/api/submit-game', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ submissionId: currentSubmissionId }),
    })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || '記錄失敗')
    showResult({ success: true, game: data.game, warnings: data.warnings })
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = '確認無誤，記錄這場' }
    alert('記錄失敗：' + err.message)   // 留在核對畫面，可再按一次
  }
}

async function pollResult(submissionId) {
  for (let i = 0; i < 50; i++) {
    await new Promise(r => setTimeout(r, 1500))
    try {
      const res = await fetch(`/api/submission-status?id=${submissionId}`)
      const data = await res.json()

      if (data.status === 'committed') {
        clearPending()
        showResult({ success: true, game: data.game, warnings: data.warnings })
        return
      }
      if (data.status === 'failed') {
        clearPending()
        showError(data.error || 'AI 解析失敗，請重新上傳')
        return
      }
      const elapsed = Math.round((i + 1) * 1.5)
      setMsg(`AI 解析中… (${elapsed}s)　請留在此畫面`)
    } catch { /* 網路短暫中斷，繼續輪詢 */ }
  }
  showTimeout(submissionId)
}

function setMsg(msg) {
  document.getElementById('processing-msg').textContent = msg
}

function showResult(result) {
  showStep('step-result')
  const g = result.game
  const homeWon = g.winner === g.homePlayer
  const awayWon = g.winner === g.awayPlayer

  document.getElementById('step-result').innerHTML = `
    <div class="result-icon">🏆</div>
    <div class="result-title">比賽記錄成功！</div>
    <div class="result-winner">${g.winner} 獲勝</div>
    <div class="result-score">
      <div>
        <div class="score-player">${g.homePlayer}</div>
        <div class="score-team" style="font-size:12px;color:var(--muted)">${g.homeTeam}</div>
        <div class="score-num ${homeWon ? 'winner' : ''}">${g.homeScore}</div>
      </div>
      <div class="score-vs">VS</div>
      <div>
        <div class="score-player">${g.awayPlayer}</div>
        <div class="score-team" style="font-size:12px;color:var(--muted)">${g.awayTeam}</div>
        <div class="score-num ${awayWon ? 'winner' : ''}">${g.awayScore}</div>
      </div>
    </div>
    ${result.warnings?.length ? `
      <div class="warnings">
        ${result.warnings.map(w => `<div class="warning-item">⚠️ ${w}</div>`).join('')}
      </div>
    ` : ''}
    <button class="btn btn-primary" onclick="location.href='/'">回到主頁</button>
    <button class="btn btn-ghost" onclick="location.reload()">再記一場</button>
  `
}

function showError(msg) {
  showStep('step-result')
  document.getElementById('step-result').innerHTML = `
    <div class="result-icon">❌</div>
    <div class="result-title">提交失敗</div>
    <div class="error-box">${msg}</div>
    <button class="btn btn-primary" onclick="showStep('step-upload')">重新上傳</button>
    <button class="btn btn-ghost" onclick="location.href='/'">返回主頁</button>
  `
}

function showTimeout(submissionId) {
  showStep('step-result')
  document.getElementById('step-result').innerHTML = `
    <div class="result-icon">⏳</div>
    <div class="result-title">查詢逾時</div>
    <div class="error-box" style="color:var(--yellow);border-color:rgba(232,196,75,0.3);background:rgba(232,196,75,0.08)">
      AI 可能還在處理中，或已完成。<br>請先查詢狀態，<strong>不要重新上傳</strong>，避免重複記錄。
    </div>
    <button class="btn btn-primary" onclick="resumePoll('${submissionId}')">繼續查詢狀態</button>
    <button class="btn btn-ghost" onclick="location.href='/'">返回主頁</button>
  `
}

async function resumePoll(submissionId) {
  showStep('step-processing')
  setMsg('繼續查詢中…')
  await pollResult(submissionId)
}

// PWA 自動更新：切回前台檢查新版、新 SW 接管時自動重載（提交頁原本沒有這段）
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(reg => {
    reg.update();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') reg.update();
    });
  });
  navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
}
</script>
